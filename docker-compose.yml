name: public-spend-pipeline

x-airflow-common: &airflow-common
  build:
    context: docker/airflow
  image: public-spend-airflow:3.3.2
  environment: &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__AUTH_MANAGER: airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/airflow
    AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY:-}
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DEFAULT_TIMEZONE: America/Lima
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-apiserver:8080/execution/
    AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_JWT_SECRET:?set AIRFLOW_JWT_SECRET in .env}
    AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: "true"
    # Project code is mounted read-only and imported by the DAGs.
    PYTHONPATH: /opt/airflow/src
    WAREHOUSE_DSN: postgresql://${WAREHOUSE_USER}:${WAREHOUSE_PASSWORD}@postgres:5432/${WAREHOUSE_DB}
    OECE_START_PERIOD: ${OECE_START_PERIOD:-2024-01}
    OECE_END_PERIOD: ${OECE_END_PERIOD:-}
    # Read by dbt/profiles.yml when the dbt_build DAG runs.
    WAREHOUSE_HOST: postgres
    WAREHOUSE_PORT: "5432"
    WAREHOUSE_USER: ${WAREHOUSE_USER}
    WAREHOUSE_PASSWORD: ${WAREHOUSE_PASSWORD}
    WAREHOUSE_DB: ${WAREHOUSE_DB}
    BI_READER_USER: ${BI_READER_USER}
  volumes:
    - ./airflow/dags:/opt/airflow/dags
    - ./src:/opt/airflow/src:ro
    - ./dbt:/opt/airflow/dbt:ro
    - airflow-logs:/opt/airflow/logs
  user: "${AIRFLOW_UID:-50000}:0"
  depends_on: &airflow-common-depends-on
    postgres:
      condition: service_healthy

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: airflow
      WAREHOUSE_DB: ${WAREHOUSE_DB:?set WAREHOUSE_DB in .env}
      WAREHOUSE_USER: ${WAREHOUSE_USER:?set WAREHOUSE_USER in .env}
      WAREHOUSE_PASSWORD: ${WAREHOUSE_PASSWORD:?set WAREHOUSE_PASSWORD in .env}
      BI_READER_USER: ${BI_READER_USER:?set BI_READER_USER in .env}
      BI_READER_PASSWORD: ${BI_READER_PASSWORD:?set BI_READER_PASSWORD in .env}
      METABASE_DB: ${METABASE_DB:?set METABASE_DB in .env}
      METABASE_DB_USER: ${METABASE_DB_USER:?set METABASE_DB_USER in .env}
      METABASE_DB_PASSWORD: ${METABASE_DB_PASSWORD:?set METABASE_DB_PASSWORD in .env}
    ports:
      - "${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d airflow"]
      interval: 10s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  airflow-init:
    <<: *airflow-common
    # The image entrypoint migrates the DB and creates the admin user
    # (driven by the _AIRFLOW_* variables), then runs `airflow version`.
    command: version
    environment:
      <<: *airflow-common-env
      _AIRFLOW_DB_MIGRATE: "true"
      _AIRFLOW_WWW_USER_CREATE: "true"
      _AIRFLOW_WWW_USER_USERNAME: ${AIRFLOW_ADMIN_USER:-admin}
      _AIRFLOW_WWW_USER_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD:?set AIRFLOW_ADMIN_PASSWORD in .env}

  airflow-apiserver:
    <<: *airflow-common
    command: api-server
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/api/v2/monitor/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    healthcheck:
      test: ["CMD-SHELL", 'airflow jobs check --job-type SchedulerJob --hostname "$${HOSTNAME}"']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

  airflow-dag-processor:
    <<: *airflow-common
    command: dag-processor
    healthcheck:
      test: ["CMD-SHELL", 'airflow jobs check --job-type DagProcessorJob --hostname "$${HOSTNAME}"']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

  metabase:
    image: metabase/metabase:v0.64.3.4
    environment:
      MB_DB_TYPE: postgres
      MB_DB_HOST: postgres
      MB_DB_PORT: "5432"
      MB_DB_DBNAME: ${METABASE_DB}
      MB_DB_USER: ${METABASE_DB_USER}
      MB_DB_PASS: ${METABASE_DB_PASSWORD}
      MB_ENCRYPTION_SECRET_KEY: ${METABASE_ENCRYPTION_KEY:?set METABASE_ENCRYPTION_KEY in .env}
      MB_ANON_TRACKING_ENABLED: "false"
      MB_CHECK_FOR_UPDATES: "false"
      # No sample database or example dashboards.
      MB_LOAD_SAMPLE_CONTENT: "false"
      JAVA_TIMEZONE: America/Lima
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 60s
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy

  # Creates the admin user, the warehouse connection and the dashboards
  # (src/public_spend/metabase + bi/metabase/questions), then exits. Safe to
  # re-run: it updates what exists.
  metabase-provision:
    build:
      context: docker/airflow
    image: public-spend-airflow:3.3.2
    entrypoint: ["python", "-m", "public_spend.metabase.provision"]
    environment:
      PYTHONPATH: /opt/airflow/src
      METABASE_URL: http://metabase:3000
      METABASE_QUESTIONS_DIR: /opt/bi/metabase/questions
      METABASE_ADMIN_EMAIL: ${METABASE_ADMIN_EMAIL:?set METABASE_ADMIN_EMAIL in .env}
      METABASE_ADMIN_PASSWORD: ${METABASE_ADMIN_PASSWORD:?set METABASE_ADMIN_PASSWORD in .env}
      WAREHOUSE_DB: ${WAREHOUSE_DB}
      BI_READER_USER: ${BI_READER_USER}
      BI_READER_PASSWORD: ${BI_READER_PASSWORD}
    volumes:
      - ./src:/opt/airflow/src:ro
      - ./bi:/opt/bi:ro
    restart: "no"
    depends_on:
      metabase:
        condition: service_healthy

volumes:
  postgres-data:
  airflow-logs:
