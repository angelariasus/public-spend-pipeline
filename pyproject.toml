[project]
name = "public-spend-pipeline"
version = "0.1.0"
description = "ELT pipeline linking Peru's public procurement (OECE/OCDS) with public investment execution (MEF)."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "psycopg[binary]>=3.3",
    "requests>=2.32",
]

[dependency-groups]
dev = [
    "pre-commit>=4.0",
    "pytest>=9.0",
    "responses>=0.26",
    "ruff>=0.17",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/public_spend"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "integration: requires a PostgreSQL database (set TEST_DATABASE_URL)",
]
